# ─────────────────────────────────────────────────────────────────────────────
# BlackVanta — Deploy to GitHub Pages
#
# Triggers: every push to the `main` branch (or manually via Actions tab).
#
# How it works:
#   1. Checkout code
#   2. Install Node 22 + npm dependencies
#   3. Run `npm run build` with production env vars from GitHub Secrets
#   4. Upload the `dist/` folder as a GitHub Pages artifact
#   5. Deploy the artifact to GitHub Pages
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VITE_WALLETCONNECT_PROJECT_ID  — from cloud.walletconnect.com
#   VITE_CONTRACT_ADDRESS          — deployed BlackVanta contract address
#   VITE_CHAIN_ID                  — 56 (mainnet), 97 (testnet), 31337 (local)
#
# Required GitHub Pages setting (Settings → Pages):
#   Source: GitHub Actions  ← select this, NOT "Deploy from a branch"
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from the Actions tab

# Grant GITHUB_TOKEN the minimum permissions needed
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; cancel any in-progress run on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The base URL must match the GitHub Pages URL path.
      # For a repo called "blackvanta-app" the base is /blackvanta-app/.
      # For a custom domain or user/org site (username.github.io) use /.
      - name: Build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          VITE_CHAIN_ID: ${{ secrets.VITE_CHAIN_ID || '56' }}
          VITE_CONTRACT_ADDRESS: ${{ secrets.VITE_CONTRACT_ADDRESS }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_USDT_ADDRESS: '0x55d398326f99059fF775485246999027B3197955'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
